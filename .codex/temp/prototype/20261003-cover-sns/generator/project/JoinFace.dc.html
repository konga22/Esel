<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
renderVals() {
const liked = !!(this.state && this.state.liked);
const vals = {
heartFill: liked ? 'currentColor' : 'none',
likePressed: liked ? 'true' : 'false',
toggleLike: () => this.setState({ liked: !liked })
};
const face = (this.state && this.state.face) || 'paint';
const show = (b) => (b ? 'block' : 'none');
for (const k of ['plain', 'paint', 'zoom', 'neck']) {
const on = face === k;
vals[k + 'Pressed'] = on ? 'true' : 'false';
vals[k + 'Bg'] = on ? '#292A27' : 'transparent';
vals[k + 'Fg'] = on ? '#F9F9FB' : '#292A27';
vals['pick_' + k] = () => this.setState({ face: k });
}
vals.vPlain = show(face === 'plain');
vals.vPaint = show(face === 'paint');
vals.vZoom = show(face === 'zoom');
vals.vNeck = show(face === 'neck');
vals.mastColor = '#FFFFFF';
return vals;
}

}
</script>
