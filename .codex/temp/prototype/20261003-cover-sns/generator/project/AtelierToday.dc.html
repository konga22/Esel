<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
renderVals() {
const picked = (this.state && this.state.picked) || 'sage';
const hero = {
sage: { word: 'Sage', size: '190px', index: '01 / 03', note: '세이지 — 마른 허브, 비 갠 뒤의 벽.' },
butter: { word: 'Butter', size: '150px', index: '02 / 03', note: '버터 — 늦은 아침, 식탁 위의 볕.' },
blue: { word: 'Blue', size: '190px', index: '03 / 03', note: '파우더 블루 — 빨아 넌 셔츠, 오후 네 시의 하늘.' }
}[picked];
const on = (id) => (picked === id ? 1 : 0);
const mark = (id) => (picked === id ? '#292A27' : 'transparent');
const pressed = (id) => (picked === id ? 'true' : 'false');
const pick = (id) => () => this.setState({ picked: id });
return {
heroWord: hero.word, heroSize: hero.size, heroIndex: hero.index, heroNote: hero.note,
sageOn: on('sage'), butterOn: on('butter'), blueOn: on('blue'),
sageMark: mark('sage'), butterMark: mark('butter'), blueMark: mark('blue'),
sagePressed: pressed('sage'), butterPressed: pressed('butter'), bluePressed: pressed('blue'),
pickSage: pick('sage'), pickButter: pick('butter'), pickBlue: pick('blue')
};
}
}
