<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
renderVals() {
const liked = !!(this.state && this.state.liked);
const vals = {
heartFill: liked ? 'currentColor' : 'none',
likePressed: liked ? 'true' : 'false',
toggleLike: () => this.setState({ liked: !liked })
};
const flipped = !!(this.state && this.state.flipped);
vals.flipDeg = flipped ? '180deg' : '0deg';
vals.flipPressed = flipped ? 'true' : 'false';
vals.toggleFlip = () => this.setState({ flipped: !flipped });
return vals;
}
}
</script>
