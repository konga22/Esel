<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오늘의 색</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:#292A27;text-decoration:none}a:hover{color:#292A27}
</style>
</helmet>
<div style="width: 393px; height: 852px; box-sizing: border-box; padding: 54px 0 34px; display: flex; flex-direction: column; overflow: hidden; background: #F9F9FB; color: #292A27; font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<main style="flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; padding: 24px 22px 0">
<div style="display: flex; justify-content: center; align-items: center; gap: 6px">
<h1 style="margin: 0; font-size: 14px; line-height: 1.5; font-weight: 400">오늘의 색</h1>
<button type="button" aria-label="오늘의 색 안내" style="width: 48px; height: 48px; margin-right: -54px; display: flex; align-items: center; justify-content: center; color: #71736C">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5.5"></path><path d="M12 7.6v.2"></path></svg>
</button>
</div>
<div style="flex: 1 1 0; display: flex; align-items: center">
<div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<button type="button" aria-pressed="{{sagePressed}}" onClick="{{pickSage}}" style="display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 14px 0">
<img src="/_blob/01c7aef9caeab80dd2ca2949e8ba18c0" alt="" style="width: 96px; height: 65px; object-fit: contain; mix-blend-mode: multiply">
<span style="font-size: 13px; line-height: 1.65">세이지</span>
<span style="width: 20px; height: 1px; margin-top: -11px; background: {{sageLine}}"></span>
</button>
<button type="button" aria-pressed="{{butterPressed}}" onClick="{{pickButter}}" style="display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 14px 0">
<img src="/_blob/76c81659c2b051a973c2071f8c1dd366" alt="" style="width: 96px; height: 65px; object-fit: contain; mix-blend-mode: multiply">
<span style="font-size: 13px; line-height: 1.65">버터</span>
<span style="width: 20px; height: 1px; margin-top: -11px; background: {{butterLine}}"></span>
</button>
<button type="button" aria-pressed="{{bluePressed}}" onClick="{{pickBlue}}" style="display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 14px 0">
<img src="/_blob/2741e570bc827c25a1b735a55cfb4f8e" alt="" style="width: 96px; height: 65px; object-fit: contain; mix-blend-mode: multiply">
<span style="font-size: 13px; line-height: 1.65">파우더 블루</span>
<span style="width: 20px; height: 1px; margin-top: -11px; background: {{blueLine}}"></span>
</button>
</div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding-bottom: 28px">
<a href="Compose.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 16px; min-height: 50px; min-width: 180px; box-sizing: border-box; padding: 12px 24px; border-radius: 2px; background: #292A27; color: #F9F9FB; font-size: 14px">
<span>착장 남기기</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3.2l1.5-2.5h6.6L16.8 8H20v11H4z"></path><circle cx="12" cy="13.2" r="3.4"></circle></svg>
</a>
<p style="margin: 0; font-size: 12px; line-height: 1.7; color: #71736C; text-align: center">둘러보기를 시작하면 오늘의 색이 정해져요.</p>
</div>
</main>
<nav aria-label="주요 화면" style="height: 54px; flex-shrink: 0; box-sizing: border-box; display: flex; justify-content: space-around; gap: 8px; padding: 3px 22px">
<a href="Main.dc.html" aria-current="page" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #292A27">
<span>오늘의 색</span>
<span style="width: 10px; height: 1px; background: #292A27"></span>
</a>
<a href="Feed.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #71736C">
<span>둘러보기</span>
<span style="width: 10px; height: 1px"></span>
</a>
<a href="Profile.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #71736C">
<span>내 전시</span>
<span style="width: 10px; height: 1px"></span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
renderVals() {
const picked = (this.state && this.state.picked) || 'sage';
const line = (id) => (picked === id ? '#292A27' : 'transparent');
const pressed = (id) => (picked === id ? 'true' : 'false');
const pick = (id) => () => this.setState({ picked: id });
return {
sageLine: line('sage'), butterLine: line('butter'), blueLine: line('blue'),
sagePressed: pressed('sage'), butterPressed: pressed('butter'), bluePressed: pressed('blue'),
pickSage: pick('sage'), pickButter: pick('butter'), pickBlue: pick('blue')
};
}
}
</script>
</body>
</html>
