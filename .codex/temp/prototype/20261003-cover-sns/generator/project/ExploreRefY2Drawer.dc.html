class Component extends DCLogic {
renderVals() {
const liked = !!(this.state && this.state.liked);
const vals = {
heartFill: liked ? 'currentColor' : 'none',
likePressed: liked ? 'true' : 'false',
toggleLike: () => this.setState({ liked: !liked })
};
const menuOpen = this.state && this.state.menu !== undefined ? this.state.menu : false;
vals.menuDisplay = menuOpen ? 'block' : 'none';
vals.menuExpanded = menuOpen ? 'true' : 'false';
vals.toggleMenu = () => this.setState({ menu: !menuOpen });
const saved = !!(this.state && this.state.tab === 'saved');
vals.mineGrid = saved ? 'none' : 'block';
vals.savedGrid = saved ? 'block' : 'none';
vals.MineOn = saved ? 'false' : 'true';
vals.SavedOn = saved ? 'true' : 'false';
vals.MineFg = saved ? '#A3A49E' : '#292A27';
vals.SavedFg = saved ? '#292A27' : '#A3A49E';
vals.MineLine = saved ? 'none' : 'inset 0 -1.5px 0 #292A27';
vals.SavedLine = saved ? 'inset 0 -1.5px 0 #292A27' : 'none';
vals.showMine = () => this.setState({ tab: 'mine' });
vals.showSaved = () => this.setState({ tab: 'saved' });
return vals;
}

}
