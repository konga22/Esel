<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
renderVals() {
const liked = !!(this.state && this.state.liked);
const vals = {
heartFill: liked ? 'currentColor' : 'none',
likePressed: liked ? 'true' : 'false',
toggleLike: () => this.setState({ liked: !liked })
};
const open = this.state && this.state.fan !== undefined ? this.state.fan : true;
vals.fanDisplay = open ? 'block' : 'none';
vals.fabExpanded = open ? 'true' : 'false';
vals.fabLabel = open ? '물감 닫기' : '물감 열기';
vals.fabPaint = open ? 'none' : 'flex';
vals.fabClose = open ? 'flex' : 'none';
vals.fabSkin = open ? 'background: #292A27; color: #F9F9FB; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24)' : 'background: rgba(249, 249, 251, 0.58); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6), 0 10px 28px rgba(0, 0, 0, 0.18)';
vals.toggleFan = () => this.setState({ fan: !open });
return vals;
}

}
